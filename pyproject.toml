[project]
name = "image2vienna"
version = "0.1.0"
description = "Map a trade mark image to Vienna Classification codes: a vision-language model describes the figurative elements, embeddings rank the classification entries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Jaime Neiva Miranda de Souza" }]
keywords = ["trademark", "vienna classification", "figurative elements", "embeddings", "wipo", "vision-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "pandas>=2.2", "nbconvert>=7.16"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]
hub = ["huggingface_hub>=0.25"]

[project.scripts]
i2vienna = "image2vienna.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image2vienna"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
